<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예약현황 | 전일 손세차</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
<link rel="stylesheet" href="css/style.css?v=20260802f">
</head>
<body>

<div class="hazard"></div>

<header class="site-header">
  <div class="container top-inner">
    <a href="index.html" class="brand">전일 손세차 <span class="wo">ADMIN</span></a>
    <div class="admin-header-actions">
      <span id="whoami" class="admin-whoami"></span>
      <button id="logoutBtn" class="btn btn-outline admin-hidden" type="button">로그아웃</button>
    </div>
  </div>
</header>

<main>
  <section class="section" id="loginView">
    <div class="container">
      <div class="section-head">
        <div>
          <p class="tag">STAFF ONLY</p>
          <h2>예약현황 로그인</h2>
        </div>
      </div>
      <form id="loginForm" class="contact-form admin-login-form">
        <div class="form-row">
          <label for="loginEmail">이메일</label>
          <input type="email" id="loginEmail" name="email" placeholder="owner@example.com" required autocomplete="username">
        </div>
        <div class="form-row">
          <label for="loginPassword">비밀번호</label>
          <input type="password" id="loginPassword" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-fill btn-block">로그인</button>
        <p class="form-note" id="loginNote"></p>
      </form>
    </div>
  </section>

  <section class="section admin-hidden" id="dashboardView">
    <div class="container">
      <div class="section-head">
        <div>
          <p class="tag">LIVE · WORK ORDER LOG</p>
          <h2>예약현황</h2>
        </div>
      </div>
      <p class="section-desc-left rate-note" id="bookingCount">불러오는 중...</p>
      <div id="bookingGroups"></div>
    </div>
  </section>
</main>

<div class="hazard"></div>

<footer class="site-footer">
  <div class="container footer-inner">
    <div class="foot-info">
      <strong>전일 손세차</strong> · 관리자 전용 페이지
    </div>
    <div class="footer-links">
      <a href="index.html">홈으로</a>
    </div>
  </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
